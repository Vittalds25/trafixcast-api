version: 1
updated: '2026-10-17'
network_notes: 'Operational lines as of 2026-10-17 per sources: Purple (Challaghatta-Whitefield, 37 stations, full since 2023-10-09), Green (Madavara-Silk Institute, 32 stations, full since 2024-11-07),
  Yellow (RV Road-Bommasandra, 16 stations, opened 2025-08-10). 83 unique stations (Majestic and RV Road are shared). Pink Line (Kalena Agrahara-Tavarekere elevated part) was reported ready but awaiting
  approval/opening (Sep 2026, unconfirmed) and Blue Line is under construction; neither appears in the ridership data (Aug-Sep 2025), so neither is included. Line order was verified against the Travelled
  Stations column of stationpair-hourly-enhanced for all pairs on each line and across both interchanges (0 mismatches). Timings/headways are the best public information found; BMRCL timetable pages were
  not machine-readable, so most are marked inferred. Frequencies change often; show "typical". Yellow headway reflects Dec 2025; ridership data for Yellow covers only its first 2 months.'
